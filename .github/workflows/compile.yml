# Compiles the firmware on every push / pull request so a broken sketch is caught automatically.
name: Compile firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          # Same settings as in the Arduino IDE: ESP32S3 Dev Module, 8 MB flash, OPI PSRAM, custom partitions.csv
          fqbn: esp32:esp32:esp32s3:FlashSize=8M,PSRAM=opi,PartitionScheme=custom
          platforms: |
            - name: esp32:esp32
              version: 3.3.7          
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: FastAccelStepper
              version: 1.2.5
            - name: LiquidCrystal_I2C     
              version: 2.0.0
          sketch-paths: |
            - firmware/AutoChessboard
